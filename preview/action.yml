name: 'Duku Preview'
description: 'Creates a per-PR Duku target and, on pull_request, orchestrates an exploration with a sticky PR comment of the top errors'
author: 'Duku AI'

inputs:
  api-url:
    description: 'Platform API GraphQL endpoint URL'
    required: false
    default: 'https://platform.duku.ai/graphql'

  api-key:
    description: 'Platform API key (generate in Viewport Settings > API Keys)'
    required: true

  auth-url:
    description: 'Authentication server URL (defaults to deriving from api-url by replacing the platform. host prefix with auth. and dropping the path)'
    required: false
    default: ''

  product-id:
    description: 'Duku product ID (from Viewport → Products)'
    required: true

  vercel-automation-bypass-secret:
    description: "Optional: if set, writes target.metadata.vercelAutomationBypassSecret for Vercel Deployment Protection bypass (used by chrome-worker automation)"
    required: false
    default: ''

  start-run:
    description: 'Start a simulation run after creating the target'
    required: false
    default: 'true'

  # Optional exploration parameters (used only when start-run=true)
  exploration-url:
    description: 'Override the URL to explore (defaults to the subject baseUrl)'
    required: false
    default: ''

  preview-url-source:
    description: "When start-run=true on a pull_request and exploration-url is not set, how to resolve the preview URL. 'auto' tries Deployments first, then optionally checks/statuses/comments if configured."
    required: false
    default: 'auto'

  preview-timeout-seconds:
    description: 'How long to wait for the preview URL to appear (used by polling-based resolvers like comments)'
    required: false
    default: ''

  preview-poll-interval-seconds:
    description: 'How frequently to poll for the preview URL (used by polling-based resolvers like comments)'
    required: false
    default: ''

  preview-deployment-environment-regex:
    description: "Optional JavaScript regex (without slashes) to match the GitHub Deployment environment name when resolving via Deployments. If empty, uses a conservative default (preview|review|staging|pr)."
    required: false
    default: ''

  preview-check-name-regex:
    description: "Optional JavaScript regex (without slashes) to match a GitHub Check Run name when resolving via Checks. If empty, the checks resolver is skipped in 'auto'."
    required: false
    default: ''

  preview-status-context-regex:
    description: "Optional JavaScript regex (without slashes) to match a commit status 'context' when resolving via Statuses. If empty, the statuses resolver is skipped in 'auto'."
    required: false
    default: ''

  preview-comment-author-logins:
    description: "Comma-separated GitHub logins whose PR comments may contain the preview URL (e.g. 'vercel[bot],netlify[bot]'). If empty, the comments resolver is skipped in 'auto'."
    required: false
    default: ''

  preview-url-regex:
    description: "Optional JavaScript regex (without slashes) to extract the preview URL from provider text (used by the comments resolver; capture group 1 preferred). If empty, the comments resolver uses a safe generic URL heuristic."
    required: false
    default: ''

  repository:
    description: 'Explicit "owner/repo" to attach PR metadata to when not running on a pull_request event (must be set together with pr-number). Lets non-pull_request triggers (push, deployment_status, workflow_run, repository_dispatch) post the PR comments.'
    required: false
    default: ''

  pr-number:
    description: 'Explicit PR number to attach to when not running on a pull_request event (must be set together with repository).'
    required: false
    default: ''

  github-installation-id:
    description: 'GitHub App installation ID for PR error reporting (optional; the server auto-discovers the installation when the Duku AI GitHub App is installed on the repo)'
    required: false
    default: ''

  github-token:
    description: 'GitHub token used to resolve the preview URL via GitHub APIs (defaults to GITHUB_TOKEN env). Not required when exploration-url is provided.'
    required: false
    default: ''

  dashboard-url:
    description: 'Base URL of the Platform dashboard, used to build batch links in the sticky comment'
    required: false
    default: ''

outputs:
  target-id:
    description: 'ID of the created target'

  target-name:
    description: 'Name of the created target'

  target-version:
    description: 'Version of the created target'

  run-id:
    description: 'ID of the started exploration (if start-run is true). On PR events, same as exploration-batch-id.'

  run-status:
    description: 'Kickoff status of the exploration. On PR events: "triggered" (both the running and terminal-results PR comments are posted by the Duku AI GitHub App). On non-PR events: the server-reported initial status.'

  exploration-batch-id:
    description: 'ID of the exploration (when running on a pull_request).'

  comment-id:
    description: 'Deprecated: always empty on PR events. The sticky PR comment is now posted by the Duku AI GitHub App server-side, so the action no longer knows its id.'

runs:
  using: 'node20'
  main: 'dist/index.js'
