name: 'Duku Preview'
description: "Records a pull request's preview as a build of an Antidote product and tests it, through the antidote CLI. The runner needs Node 22.4 or newer with npx (actions/setup-node), on Linux or macOS. Antidote posts the results on the pull request."
author: 'Duku AI'

inputs:
  api-url:
    description: 'The Antidote Platform URL. Only its origin is used, so the old GraphQL endpoint URL still works.'
    required: false
    default: 'https://platform.duku.ai/graphql'

  api-key:
    description: 'An Antidote API key (Viewport Settings > API Keys). Set this or service-identity.'
    required: false
    default: ''

  service-identity:
    description: "A service identity's id (svc_…) to sign in with the job's GitHub OIDC token, so no secret is stored. The job needs `permissions: id-token: write`. Set this or api-key."
    required: false
    default: ''

  oidc-audience:
    description: "The audience of the GitHub OIDC token, only with service-identity. Empty uses the Platform's origin, the default audience of a trust rule made in Viewport."
    required: false
    default: ''

  auth-url:
    description: "Deprecated and ignored: the antidote CLI finds the sign-in endpoint itself. Only the environment action's apk-path still reads it."
    required: false
    default: ''

  product-id:
    description: 'Duku product ID (from Viewport → Products)'
    required: true

  vercel-automation-bypass-secret:
    description: "Deprecated: the Vercel Deployment Protection bypass secret. Sent as the secret vercel_automation_bypass with the header x-vercel-protection-bypass, only to the origin of the URL the run explores. Ignored when request-headers or request-secrets is set; use those instead."
    required: false
    default: ''

  request-headers:
    description: "Optional: headers the runs of this build send to the preview, one 'Name: value' per line. A value is stored and shown in plain text, so put every secret part in a {{secret.<name>}} reference to a request-secrets entry, e.g. 'x-vercel-protection-bypass: {{secret.vercel_bypass}}'. Each header is sent only to the origin of the URL the run explores. A header of the same name on the environment is used instead."
    required: false
    default: ''

  request-secrets:
    description: "Optional: secrets the request headers reference, one 'name=value' per line (name: 1 to 64 of a-z, 0-9 and _, not __proto__). Every value is masked in the job log, stored encrypted, never returned by any read, and sent only to the origin of the URL the run explores."
    required: false
    default: ''

  start-run:
    description: 'DEPRECATED: use `run-exploration` instead. Start a simulation run after creating the target'
    required: false
    default: ''

  run-exploration:
    description: 'Start an exploration after creating the target'
    required: false
    default: ''

  release-label:
    description: 'Optional human-readable release name for this build, e.g. 1.4.2. Recorded alongside the commit SHA and used as the build version.'
    required: false
    default: ''

  # Optional exploration parameters (used only when run-exploration is true)
  exploration-url:
    description: 'Override the URL to explore (defaults to the subject baseUrl)'
    required: false
    default: ''

  preview-url-source:
    description: "When run-exploration=true on a pull_request and exploration-url is not set, how to resolve the preview URL. 'auto' tries the sha-keyed resolvers only — Deployments, then Checks, then Statuses. It never reads PR comments: those advertise a provider's mutable branch alias, not this commit's build. Set 'comments' explicitly to opt into that."
    required: false
    default: 'auto'

  preview-timeout-seconds:
    description: 'How long to wait for the preview URL to appear (used by polling-based resolvers like comments)'
    required: false
    default: ''

  preview-poll-interval-seconds:
    description: 'How frequently to poll for the preview URL (used by polling-based resolvers like comments)'
    required: false
    default: ''

  preview-deployment-environment-regex:
    description: "Optional JavaScript regex (without slashes) to match the GitHub Deployment environment name when resolving via Deployments. If empty, uses a conservative default (preview|review|staging|pr)."
    required: false
    default: ''

  preview-check-name-regex:
    description: "Optional JavaScript regex (without slashes) to match a GitHub Check Run name when resolving via Checks. If empty, the checks resolver is skipped in 'auto'."
    required: false
    default: ''

  preview-status-context-regex:
    description: "Optional JavaScript regex (without slashes) to match a commit status 'context' when resolving via Statuses. If empty, the statuses resolver is skipped in 'auto'."
    required: false
    default: ''

  preview-comment-author-logins:
    description: "Comma-separated GitHub logins whose PR comments may contain the preview URL (e.g. 'vercel[bot],netlify[bot]'). If empty, the comments resolver is skipped in 'auto'."
    required: false
    default: ''

  preview-url-regex:
    description: "Optional JavaScript regex (without slashes) to extract the preview URL from provider text (used by the comments resolver; capture group 1 preferred). If empty, the comments resolver uses a safe generic URL heuristic."
    required: false
    default: ''

  wait-for-target-seconds:
    description: "Seconds to let the platform wait for the preview URL to actually serve before it dispatches. The preview-url resolvers above only prove a URL was published; a preview that loses the race with its own deploy is still cold when the run fires. Empty (default) dispatches immediately, exactly as before."
    required: false
    default: ''

  credential-set:
    description: "Optional: the credential set to log in with, by name or ID, from this product's sets. An unknown set fails the step; it never falls back to the default. Ignored when run-exploration is false."
    required: false
    default: ''

  repository:
    description: 'Explicit "owner/repo" of the pull request to test when not running on a pull_request event (must be set together with pr-number, and needs github-token to read its head). Lets non-pull_request triggers (push, deployment_status, workflow_run, repository_dispatch) test the pull request.'
    required: false
    default: ''

  pr-number:
    description: 'Explicit PR number to attach to when not running on a pull_request event (must be set together with repository).'
    required: false
    default: ''

  github-installation-id:
    description: 'Deprecated and ignored: the Antidote Platform finds the GitHub App installation itself.'
    required: false
    default: ''

  github-token:
    description: "GitHub token used to resolve the preview URL via GitHub APIs, and to read the pull request's head with repository + pr-number (defaults to GITHUB_TOKEN env). Not required on a pull_request run when exploration-url is provided."
    required: false
    default: ''

outputs:
  target-id:
    description: 'ID of the created target'

  target-name:
    description: 'Name of the created target'

  target-version:
    description: 'Version of the created target'

  run-id:
    description: 'The agentic execution the build started (on a pull request, its agentic pull request test). Empty when nothing was started.'

  run-status:
    description: '"triggered" when an agentic execution started, else "skipped".'

  exploration-batch-id:
    description: 'Deprecated: always empty.'

  comment-id:
    description: 'Deprecated: always empty. The Antidote Bot GitHub App posts the pull request comment.'

  preview-url-source:
    description: "How the preview URL was found: deployments, checks, statuses, comments, or override when exploration-url was set. Empty when no URL was sent."

runs:
  using: 'node24'
  main: 'dist/index.js'
