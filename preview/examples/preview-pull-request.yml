# pull_request example for the duku-ai/actions/preview action.
# Copy into .github/workflows/ in your repo and adjust the secrets/variables
# to match your setup.
#
# On a PR the action resolves the preview URL from GitHub, records the build
# through the antidote CLI and exits in seconds. Antidote tests it when someone
# mentions @antidoteapp on the pull request, or, with pr-tests: first_revision,
# the pull request's first build automatically. The results are posted on the
# pull request through the Antidote Bot GitHub App; install it on the repo:
# https://github.com/apps/antidote-bot

name: Antidote preview

on:
  pull_request:
    # ready_for_review records a draft's build again once it is marked ready, so
    # pr-tests: first_revision tests it then.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: antidote-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    # Action exits in seconds; this cap only guards against network hangs.
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read      # required for preview URL resolution
      id-token: write        # with service-identity, or to sign in as the managed identity
    steps:
      # From 1.0.0 the action runs the antidote CLI, which needs Node 22.4 or newer.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: duku-ai/actions/preview@preview/v1
        with:
          api-key: ${{ secrets.PLATFORM_API_KEY }}
          # Or, with no stored secret, a service identity whose trust rule
          # accepts this repository's GitHub OIDC tokens:
          # service-identity: svc_...
          product-id: ${{ vars.PLATFORM_PRODUCT_ID }}
          # Optional: test each pull request's first build without a mention.
          # pr-tests: first_revision
          # Optional: headers for a protected preview, here Vercel Deployment
          # Protection. Secret parts go in request-secrets, masked in the log.
          # request-headers: |
          #   x-vercel-protection-bypass: {{secret.vercel_bypass}}
          # request-secrets: |
          #   vercel_bypass=${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
