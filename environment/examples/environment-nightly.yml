# Nightly run against a release you name, triggered from your own job.
# Copy into .github/workflows/ in your repo and adjust the environment name
# and the product-id variable to match your setup.
#
# Trigger it at the end of your nightly job (e.g. after a data reset), passing
# the build that is deployed:
#
#   gh workflow run duku-nightly.yml -f release=2026.09.24-build.812
#
# or, from a CI with no gh CLI, a repository_dispatch:
#
#   curl -sS -X POST https://api.github.com/repos/<owner>/<repo>/dispatches \
#     -H "Authorization: Bearer $GITHUB_TOKEN" \
#     -d '{"event_type":"duku-nightly","client_payload":{"release":"2026.09.24-build.812"}}'
#
# Each distinct `release` becomes its own release in Viewport. Sending the same
# one again re-runs against that release rather than creating a new one.

name: Duku nightly

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'The build deployed to the environment, e.g. 2026.09.24-build.812'
        required: true
  repository_dispatch:
    types: [duku-nightly]

concurrency:
  group: duku-nightly
  cancel-in-progress: false

jobs:
  explore:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: duku-ai/actions/environment@environment/v0.4.1
        with:
          api-key: ${{ secrets.PLATFORM_API_KEY }}
          product-id: ${{ vars.DUKU_PRODUCT_ID }}
          # Must match an environment declared in
          # Viewport → Product settings → Environments.
          environment: staging
          release-label: ${{ inputs.release || github.event.client_payload.release }}
          # Fail on a missing release rather than fall back to this repo's git describe.
          release-label-from: input
