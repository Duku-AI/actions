# Minimal push-trigger example for the duku-ai/actions/environment action.
# Copy into .github/workflows/ in your repo and adjust the branches list,
# the environment name, and the product-id variable to match your setup.

name: Duku environment

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: duku-env-staging
  cancel-in-progress: false

jobs:
  explore:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: duku-ai/actions/environment@environment/v0.4.0
        with:
          api-key: ${{ secrets.PLATFORM_API_KEY }}
          product-id: ${{ vars.DUKU_PRODUCT_ID }}
          # Must match an environment declared in
          # Viewport → Product settings → Environments.
          environment: staging
