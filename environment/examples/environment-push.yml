# Minimal push-trigger example for the duku-ai/actions/environment action.
# Copy into .github/workflows/ in your repo and adjust the branches list,
# the environment name, and the product-id variable to match your setup.

name: Duku environment

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: duku-env-staging
  cancel-in-progress: false

jobs:
  explore:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # From vNEXT the action runs the antidote CLI, which needs Node 22.4 or newer.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: duku-ai/actions/environment@environment/v0.5.0
        with:
          api-key: ${{ secrets.PLATFORM_API_KEY }}
          # Or, from vNEXT and with no stored secret, a service identity
          # whose trust rule accepts this repository's GitHub OIDC tokens
          # (the job then needs `id-token: write`):
          # service-identity: svc_...
          product-id: ${{ vars.DUKU_PRODUCT_ID }}
          # Must match an environment declared in
          # Viewport → Product settings → Environments.
          environment: staging
