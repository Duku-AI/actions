name: 'Duku Environment'
description: 'Records the build a commit produced against one of your Antidote environments as a release and tests it, through the antidote CLI, so for a web build the runner needs Node 22.4 or newer with npx (actions/setup-node), on Linux or macOS. The action starts the test and exits; results appear in Viewport. For push / schedule / workflow_dispatch: a run whose event carries a pull request fails (use the preview action).'
author: 'Duku AI'

inputs:
  api-key:
    description: 'An Antidote API key (Viewport Settings → API Keys). Set this or service-identity. Required with apk-path.'
    required: false
    default: ''

  service-identity:
    description: "A service identity's id (svc_…) to sign in with the job's GitHub OIDC token, so no secret is stored. The job needs `permissions: id-token: write`. Set this or api-key."
    required: false
    default: ''

  oidc-audience:
    description: "The audience of the GitHub OIDC token, only with service-identity. Empty uses the Platform's origin, the default audience of a trust rule made in Viewport."
    required: false
    default: ''

  product-id:
    description: 'Antidote product ID (from Viewport → Products). Records a build per commit on one of its environments.'
    required: true

  environment:
    description: 'Name of an environment declared on the product (Viewport → Product settings → Environments), e.g. staging. Optional with `product-id`: when empty the run lands on the product''s default environment.'
    required: false
    default: ''

  release-label:
    description: 'Explicit release name for this build, e.g. 1.4.2. Recorded alongside the commit SHA. When set it wins over `release-label-from`.'
    required: false
    default: ''

  release-label-from:
    description: 'Where the release name comes from when `release-label` is unset: `git-describe` (default, `git describe --tags --always --dirty`), `git-tag` (exact tag on HEAD), `package-json` (version field), or `input` (only `release-label`; when it is empty a run with a verified commit or branch is named by its short SHA, and any other run fails before anything is recorded). A derived source that yields nothing falls back to the short SHA with a warning, never a failure.'
    required: false
    default: 'git-describe'

  package-json-path:
    description: 'Path to package.json, relative to the checkout root. Only read when `release-label-from` is `package-json`.'
    required: false
    default: 'package.json'

  commit:
    description: 'The deployed commit, as a tag, branch or SHA, for runs where GitHub names none (workflow_dispatch, schedule). Looked up in this repository and recorded as the build''s verified commit; a commit GitHub can''t find fails the step. A bare SHA must be on the default branch (pass a tag or branch otherwise). Disables `release-label-from`, so pass `release-label`. Needs `github-token` with `contents: read`. Not allowed on push, where GitHub already names the commit.'
    required: false
    default: ''

  apk-path:
    description: 'Path to the Android build to test: one .apk file, or a directory holding exactly one .apk. When set, the action uploads it, waits until Antidote has checked it, records it as this build and explores it. Needs api-key.'
    required: false
    default: ''

  target-id:
    description: 'Removed in v1: setting it fails the step. Use product-id with environment.'
    required: false
    default: ''

  url:
    description: "Removed in v1: setting it fails the step. The environment's URL is set in Viewport → Product settings → Environments."
    required: false
    default: ''

  exploration-url:
    description: "Removed in v1: setting it fails the step. The environment's URL is set in Viewport → Product settings → Environments."
    required: false
    default: ''

  api-url:
    description: 'The Antidote Platform URL. Only its origin is used, so the old GraphQL endpoint URL still works; with apk-path the build is uploaded to <origin>/graphql.'
    required: false
    default: 'https://platform.duku.ai/graphql'

  auth-url:
    description: 'Deprecated and ignored, except with apk-path: the antidote CLI finds the sign-in endpoint itself. With apk-path it is the Keycloak URL the API key signs in at, derived from api-url when empty.'
    required: false
    default: ''

  repository:
    description: 'Removed in v1: setting it fails the step. Pull requests are the preview action''s.'
    required: false
    default: ''

  pr-number:
    description: 'Removed in v1: setting it fails the step. Pull requests are the preview action''s.'
    required: false
    default: ''

  github-installation-id:
    description: 'Deprecated and ignored: the Antidote Platform finds the GitHub App installation itself.'
    required: false
    default: ''

  github-token:
    description: 'GitHub token, used only to look the `commit` input up (needs contents: read). Falls back to GITHUB_TOKEN from env if unset.'
    required: false
    default: ''

  run-exploration:
    description: 'Start an exploration run. Set false to record the build without one.'
    required: false
    default: 'true'

  wait-for-deployment:
    description: 'Poll the environment URL until it serves the expected commit before anything is recorded. The app must expose its deployed commit as a response header (see wait-commit-header). Off by default.'
    required: false
    default: 'false'

  wait-for-deployment-timeout-seconds:
    description: 'How long to wait for the expected commit before failing the step. Defaults to 300 (the antidote CLI''s default).'
    required: false

  wait-for-deployment-interval-seconds:
    description: 'Delay between deployment polls, in seconds. Defaults to 10 (the antidote CLI''s default).'
    required: false

  wait-commit-header:
    description: 'Response header the app exposes its deployed commit hash on (case-insensitive). Defaults to x-commit-sha (the antidote CLI''s default).'
    required: false

  wait-commit-path:
    description: 'Path appended to the environment URL on each poll (e.g. /api/health). Defaults to / (the antidote CLI''s default).'
    required: false

outputs:
  target-id:
    description: 'ID of the build the run was attributed to.'

  release-id:
    description: 'ID of the release (app version) the build landed as.'

  run-id:
    description: 'The agentic execution the build started. Empty when nothing was started.'

  run-status:
    description: 'triggered (an agentic execution started; see Viewport for its results), started (Android: discovery started; no run id, see Viewport), or skipped (nothing was started)'

  build-warnings:
    description: 'Android only: warnings about the uploaded APK (one per line). Empty without apk-path.'

  comment-id:
    description: 'Deprecated: always empty.'

runs:
  using: 'node24'
  main: 'dist/index.js'
