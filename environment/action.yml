name: 'Duku Environment'
description: 'Records the build a commit produced against one of your Duku environments, then triggers an exploration and/or test cases against it. The action kicks off the runs and exits — terminal results appear in Viewport. Intended for push / schedule / workflow_dispatch.'
author: 'Duku AI'

inputs:
  api-key:
    description: 'Platform API key (generate in Viewport Settings → API Keys)'
    required: true

  product-id:
    description: 'Duku product ID (from Viewport → Products). Use with `environment`; mints a build per commit against that endpoint.'
    required: false
    default: ''

  environment:
    description: 'Name of an environment declared on the product (Viewport → Product settings → Environments), e.g. staging. Required with `product-id`.'
    required: false
    default: ''

  release-label:
    description: 'Optional human-readable release name for this build, e.g. 1.4.2. Recorded alongside the commit SHA.'
    required: false
    default: ''

  target-id:
    description: 'DEPRECATED: pre-created environment target ID from Viewport. Runs are not attributed to a release — use product-id + environment instead. Mutually exclusive with them.'
    required: false
    default: ''

  url:
    description: 'Override the URL to explore. Only valid with `target-id` (defaults to the target buildUrl); with `environment` the endpoint owns its URL.'
    required: false
    default: ''

  api-url:
    description: 'Platform API GraphQL endpoint URL'
    required: false
    default: 'https://platform.duku.ai/graphql'

  auth-url:
    description: 'Authentication server URL (defaults to deriving from api-url by replacing the platform. host prefix with auth. and dropping the path)'
    required: false
    default: ''

  repository:
    description: 'Explicit "owner/repo" to attach PR metadata to when not running on a pull_request event (must be set together with pr-number). Lets non-pull_request triggers post the PR comment.'
    required: false
    default: ''

  pr-number:
    description: 'Explicit PR number to attach to when not running on a pull_request event (must be set together with repository).'
    required: false
    default: ''

  github-installation-id:
    description: 'GitHub App installation ID for PR error reporting (optional; the server can auto-discover the installation when the Duku GitHub App is installed on the repo)'
    required: false
    default: ''

  github-token:
    description: 'GitHub token. On a pull_request event it posts the sticky "running" PR comment (needs pull-requests: write). On a push it resolves which PRs the pushed commits came from, so a PR''s preview builds can be linked to the build that shipped (needs pull-requests: read). Falls back to GITHUB_TOKEN from env if unset. Optional on both paths — without it the comment and the link are skipped, never failed. Unused on schedule / workflow_dispatch.'
    required: false
    default: ''

  run-exploration:
    description: 'Start an exploration run. Set false to trigger only the test batch.'
    required: false
    default: 'true'

  run-tests:
    description: "Trigger the target's test cases. Set false to explore only."
    required: false
    default: 'true'

  test-runs-per-path:
    description: 'Optional override for runs per path on runAllTestCases'
    required: false
    default: ''

  test-paths-per-goal:
    description: 'Optional override for paths per goal on runAllTestCases'
    required: false
    default: ''

outputs:
  run-id:
    description: 'ID of the exploration batch. Empty when run-exploration is false.'

  run-status:
    description: 'Kickoff status of the exploration: triggered (running asynchronously — see Viewport for terminal status), or skipped (run-exploration is false)'

  test-run-id:
    description: 'ID of the test-run batch (intent batch). Empty if the target has no test cases configured, or run-tests is false.'

  test-run-status:
    description: 'Kickoff status of the test-run batch: triggered (running asynchronously in Viewport), or skipped (no test cases configured, or run-tests is false)'

  comment-id:
    description: 'ID of the sticky PR comment posted by the action (only set when invoked on a pull_request event with a github-token)'

runs:
  using: 'node20'
  main: 'dist/index.js'
